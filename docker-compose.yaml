# Local orchestration. All services run in-country per the project constitution.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-torob}
      POSTGRES_USER: ${POSTGRES_USER:-torob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-torob}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    ports:
      - "7700:7700"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_ENGINE: postgresql
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      DJANGO_DEBUG: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SMS_GATEWAY_BACKEND: ${SMS_GATEWAY_BACKEND:-apps.accounts.sms.ConsoleSmsGateway}
      SMS_GATEWAY_API_KEY: ${SMS_GATEWAY_API_KEY:-}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-dev-only-change-me}
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

volumes:
  pgdata:
  redisdata:
  meilidata:
