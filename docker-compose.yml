
services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      internal:

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      internal:

  backend:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/media
      ARTIFACT_STORAGE_BACKEND: filesystem
      CRAWL4AI_CDP_URL: ws://playwright:3000?token=${BROWSER_TOKEN}
      PLAYWRIGHT_CDP_URL: ws://playwright:3000?token=${BROWSER_TOKEN}
      STATIC_ROOT: /app/backend/src/staticfiles
    networks: [internal]
#    command: ["python", "backend/src/manage.py", "collectstatic", "--no-input"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
      - crawl_data:/app/traces
      - /var/deployment/zeytoon/static:/app/backend/src/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      playwright:
        condition: service_started
    restart: unless-stopped

  db-worker:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/media
      ARTIFACT_STORAGE_BACKEND: filesystem
      CRAWL4AI_CDP_URL: ws://playwright:3000?token=${BROWSER_TOKEN}
      PLAYWRIGHT_CDP_URL: ws://playwright:3000?token=${BROWSER_TOKEN}
    command: ["python", "/app/backend/src/manage.py", "db_worker"]
    volumes:
      - media_data:/app/media
      - crawl_data:/app/traces
    depends_on:
      - backend
      - redis
    restart: unless-stopped
    networks: [internal]

  playwright:
    image: ghcr.io/browserless/chromium:latest
    init: true
    shm_size: 1gb
    environment:
      TOKEN: ${BROWSER_TOKEN}
      CONCURRENT: 5
      TIMEOUT: 120000
    expose:
      - "3000"
    networks:
      internal:
        aliases: [ playwright ]
      shared_net:
        aliases: [ browser ]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://backend:8000
    environment:
      API_INTERNAL_BASE_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      internal:
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
  crawl_data:


networks:
  internal:
  shared_net:
    external: true
