[project]
name = "torob-challenge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "django-guardian>=3.0.0",
    "django-constance>=4.4.0",
    "django-cors-headers>=4.9.0",
    "django-redis>=6.0.0",
    "phonenumbers>=9.0.0",
    "drf-spectacular>=0.28.0",
    "pydantic>=2.12.0",
    "psycopg[binary]>=3.2.0",
    "gunicorn>=23.0.0",
    "domtrack",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "django-storages>=1.14",
    "boto3>=1.34",
    "formulas>=1.3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-django>=4.11.0",
    "freezegun>=1.5.0",
]

[[tool.uv.index]]
url = "https://package-mirror.liara.ir/repository/pypi/simple"
default = true

[tool.uv.sources]
domtrack = { url = "https://github.com/MhkaPR/domtrack/releases/download/v0.0.2/domtrack-0.0.2-py3-none-any.whl" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend/src"]
testpaths = ["backend/src"]
