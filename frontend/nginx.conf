worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request "$status" $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Next.js standalone server (started by the entrypoint on 3001).
    upstream next_app {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    # Django backend on the Compose network.
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 3000;
        listen [::]:3000;
        server_name _;

        # Trace uploads and captured artifacts can be large.
        client_max_body_size 100m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        # API: everything under /api goes to Django, never to Next.
        location /api/ {
            proxy_pass http://backend_api;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Django-served media (trace files, screenshots).
        location /media/ {
            proxy_pass http://backend_api;
            proxy_read_timeout 300s;
        }

        # Immutable Next.js build assets.
        location /_next/static/ {
            proxy_pass http://next_app;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            proxy_pass http://next_app;
            proxy_read_timeout 120s;
        }
    }
}
